# Rime schema
# encoding: utf-8
---
schema:
  schema_id: bopomofo_t9
  name: T9注音
  version: "1.0"
  author:
    - Trime Watch Team
  description: |
    T9注音輸入方案，專為智慧手錶圓形螢幕設計。
    使用九宮格數字鍵映射注音符號，支援預測性輸入。

    T9映射表：
    1: ㄅㄉㄚ  2: ㄍㄐㄞㄧ  3: ㄓㄗㄢㄦ
    4: ㄆㄊㄛ  5: ㄎㄑㄟㄨ  6: ㄔㄘㄣ
    7: ㄇㄋㄜㄝ 8: ㄏㄒㄠㄩ  9: ㄕㄙㄤㄥ
    0: ㄈㄌㄡㄖ


trime:
  import_preset: bopomofo_t9_watch

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [。，, ．，]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters: []

speller:
  alphabet: '1234567890ab'
  delimiter: " '"
  max_code_length: 8
  auto_select: false
  algebra:
    # 1. 移除聲調
    - xform/ˊ//
    - xform/ˇ//
    - xform/ˋ//
    - xform/˙//

    # 2. 注音符號映射到 12 鍵（按傳統注音順序分組）
    # 1:ㄅㄉ
    - xform/ㄅ/1/
    - xform/ㄉ/1/
    # 2:ㄓㄚ
    - xform/ㄓ/2/
    - xform/ㄚ/2/
    # 3:ㄞㄢㄦ
    - xform/ㄞ/3/
    - xform/ㄢ/3/
    - xform/ㄦ/3/
    # 4:ㄆㄊㄍ
    - xform/ㄆ/4/
    - xform/ㄊ/4/
    - xform/ㄍ/4/
    # 5:ㄐㄔㄗ
    - xform/ㄐ/5/
    - xform/ㄔ/5/
    - xform/ㄗ/5/
    # 6:ㄧㄛㄟㄣ
    - xform/ㄧ/6/
    - xform/ㄛ/6/
    - xform/ㄟ/6/
    - xform/ㄣ/6/
    # 7:ㄇㄋㄎ
    - xform/ㄇ/7/
    - xform/ㄋ/7/
    - xform/ㄎ/7/
    # 8:ㄑㄕㄘ
    - xform/ㄑ/8/
    - xform/ㄕ/8/
    - xform/ㄘ/8/
    # 9:ㄨㄜㄠㄤ
    - xform/ㄨ/9/
    - xform/ㄜ/9/
    - xform/ㄠ/9/
    - xform/ㄤ/9/
    # 0:ㄈㄌㄏ
    - xform/ㄈ/0/
    - xform/ㄌ/0/
    - xform/ㄏ/0/
    # a:ㄒㄖㄙ
    - xform/ㄒ/a/
    - xform/ㄖ/a/
    - xform/ㄙ/a/
    # b:ㄩㄝㄡㄥ
    - xform/ㄩ/b/
    - xform/ㄝ/b/
    - xform/ㄡ/b/
    - xform/ㄥ/b/

    # 3. 移除空格
    - xform/ //

    # 4. T9 簡碼：讓多位數編碼產生首位數簡碼
    - abbrev/^([0-9ab]).+$/$1/

menu:
  page_size: 400

translator:
  dictionary: bopomofo_t9
  spelling_hints: 8
  enable_completion: true
  sentence_over_completion: false
  strict_spelling: false

  # T9專用設定
  initial_quality: 1.2
  max_homophones: 12
  max_homographs: 1

  # 輸入顯示格式 - 手錶T9專用優化
  preedit_format:
    # 簡化數字序列顯示，適應小螢幕（12 鍵映射）
    - "xform/1/[1]ㄅㄉ/"
    - "xform/2/[2]ㄓㄚ/"
    - "xform/3/[3]ㄞㄢㄦ/"
    - "xform/4/[4]ㄆㄊㄍ/"
    - "xform/5/[5]ㄐㄔㄗ/"
    - "xform/6/[6]ㄧㄛㄟㄣ/"
    - "xform/7/[7]ㄇㄋㄎ/"
    - "xform/8/[8]ㄑㄕㄘ/"
    - "xform/9/[9]ㄨㄜㄠㄤ/"
    - "xform/0/[0]ㄈㄌㄏ/"
    - "xform/a/[a]ㄒㄖㄙ/"
    - "xform/b/[b]ㄩㄝㄡㄥ/"

    # 多位數序列格式化
    - "xform/([0-9ab])([0-9ab])/[$1][$2] → /"

  comment_format:
    - "xform/^([0-9ab]+)$/T9:$1/"
    - "xform/^([ㄅ-ㄩˊˇˋ˙]+)$/注音:$1/"

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default
  bindings:
    - {when: has_menu, accept: minus, send: minus}
    - {when: has_menu, accept: equal, send: equal}

recognizer:
  import_preset: default
