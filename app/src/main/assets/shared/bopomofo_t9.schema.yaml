# Rime schema
# encoding: utf-8
---
schema:
  schema_id: bopomofo_t9
  name: T9注音
  version: "1.0"
  author:
    - Trime Watch Team
  description: |
    T9注音輸入方案，專為智慧手錶圓形螢幕設計。
    使用九宮格數字鍵映射注音符號，支援預測性輸入。

    T9映射表：
    1: ㄅㄉㄚ  2: ㄍㄐㄞㄧ  3: ㄓㄗㄢㄦ
    4: ㄆㄊㄛ  5: ㄎㄑㄟㄨ  6: ㄔㄘㄣ
    7: ㄇㄋㄜㄝ 8: ㄏㄒㄠㄩ  9: ㄕㄙㄤㄥ
    0: ㄈㄌㄡㄖ


trime:
  import_preset: bopomofo_t9_watch

switches:
  - name: ascii_mode
    reset: 0
    states: [中文, 英文]
  - name: full_shape
    states: [半角, 全角]
  - name: ascii_punct
    states: [。，, ．，]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: '1234567890'
  delimiter: " '"
  max_code_length: 8
  auto_select: false
  algebra:
    # 1. 移除聲調
    - xform/ˊ//
    - xform/ˇ//
    - xform/ˋ//
    - xform/˙//

    # 2. 注音符號映射到數字鍵
    # 1: ㄅㄉㄚ
    - xform/ㄅ/1/
    - xform/ㄉ/1/
    - xform/ㄚ/1/
    # 2: ㄍㄐㄞㄧ
    - xform/ㄍ/2/
    - xform/ㄐ/2/
    - xform/ㄞ/2/
    - xform/ㄧ/2/
    # 3: ㄓㄗㄢㄦ
    - xform/ㄓ/3/
    - xform/ㄗ/3/
    - xform/ㄢ/3/
    - xform/ㄦ/3/
    # 4: ㄆㄊㄛ
    - xform/ㄆ/4/
    - xform/ㄊ/4/
    - xform/ㄛ/4/
    # 5: ㄎㄑㄟㄨ
    - xform/ㄎ/5/
    - xform/ㄑ/5/
    - xform/ㄟ/5/
    - xform/ㄨ/5/
    # 6: ㄔㄘㄣ
    - xform/ㄔ/6/
    - xform/ㄘ/6/
    - xform/ㄣ/6/
    # 7: ㄇㄋㄜㄝ
    - xform/ㄇ/7/
    - xform/ㄋ/7/
    - xform/ㄜ/7/
    - xform/ㄝ/7/
    # 8: ㄏㄒㄠㄩ
    - xform/ㄏ/8/
    - xform/ㄒ/8/
    - xform/ㄠ/8/
    - xform/ㄩ/8/
    # 9: ㄕㄙㄤㄥ
    - xform/ㄕ/9/
    - xform/ㄙ/9/
    - xform/ㄤ/9/
    - xform/ㄥ/9/
    # 0: ㄈㄌㄡㄖ
    - xform/ㄈ/0/
    - xform/ㄌ/0/
    - xform/ㄡ/0/
    - xform/ㄖ/0/

    # 3. 移除空格
    - xform/ //

    # 4. T9 簡碼：讓多位數編碼產生首位數簡碼
    # 這樣輸入單個數字時，所有以該數字開頭的字都會出現在候選詞中
    # 例如：輸入 8 時，除了精確匹配的「於」(8)，還會顯示「好」(88)、「和」(83) 等
    - abbrev/^([0-9]).+$/$1/

translator:
  dictionary: bopomofo_t9
  spelling_hints: 8
  enable_completion: true
  sentence_over_completion: false
  strict_spelling: false

  # T9專用設定
  initial_quality: 1.2
  max_homophones: 12
  max_homographs: 1

  # 輸入顯示格式 - 手錶T9專用優化
  preedit_format:
    # 簡化數字序列顯示，適應小螢幕
    - "xform/1/[1]ㄅㄉㄚ/"
    - "xform/2/[2]ㄍㄐㄞㄧ/"
    - "xform/3/[3]ㄓㄗㄢㄦ/"
    - "xform/4/[4]ㄆㄊㄛ/"
    - "xform/5/[5]ㄎㄑㄟㄨ/"
    - "xform/6/[6]ㄔㄘㄣ/"
    - "xform/7/[7]ㄇㄋㄜㄝ/"
    - "xform/8/[8]ㄏㄒㄠㄩ/"
    - "xform/9/[9]ㄕㄙㄤㄥ/"
    - "xform/0/[0]ㄈㄌㄡㄖ/"

    # 多位數序列格式化
    - "xform/([0-9])([0-9])/[$1][$2] → /"

  comment_format:
    - "xform/^([0-9]+)$/T9:$1/"
    - "xform/^([ㄅ-ㄩ]+)$/注音:$1/"

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default
  bindings:
    - {when: has_menu, accept: minus, send: minus}
    - {when: has_menu, accept: equal, send: equal}

recognizer:
  import_preset: default
