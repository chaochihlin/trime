# Rime schema
# encoding: utf-8

schema:
  schema_id: bopomofo_t9
  name: T9注音
  version: "1.0"
  author:
    - Trime Watch Team
  description: |
    T9注音輸入方案，專為智慧手錶圓形螢幕設計。
    使用九宮格數字鍵映射注音符號，支援預測性輸入。

    T9映射表：
    1: ㄅㄉㄚ  2: ㄍㄐㄞㄧ  3: ㄓㄗㄢㄦ
    4: ㄆㄊㄛ  5: ㄎㄑㄟㄨ  6: ㄔㄘㄣ
    7: ㄇㄋㄜㄝ 8: ㄏㄒㄠㄩ  9: ㄕㄙㄤㄥ
    0: ㄈㄌㄡㄖ


trime:
  import_preset: bopomofo_t9_watch

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中文, 英文 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

speller:
  alphabet: 'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦㄧㄨㄩ1234567890'
  initials: 'ㄅㄆㄇㄈㄉㄊㄋㄌㄍㄎㄏㄐㄑㄒㄓㄔㄕㄖㄗㄘㄙ'
  finals: 'ㄚㄛㄜㄝㄞㄟㄠㄡㄢㄣㄤㄥㄦㄧㄨㄩ'
  delimiter: " '"
  max_code_length: 8
  auto_select: false
  algebra:
    # 移除無效輸入
    - erase/^$/

    # T9數字映射轉換規則
    # 處理順序：先處理長序列，再處理短序列，避免衝突

    # 多字符T9組合映射 - 常見注音組合
    # 例: 123 -> ㄅ+ㄧ+ㄢ (邊), ㄉ+ㄧ+ㄢ (點)
    - derive/123/ㄅㄧㄢ/
    - derive/123/ㄉㄧㄢ/
    - derive/123/ㄅㄞㄢ/
    - derive/123/ㄉㄚㄦ/

    # 89 -> 我 (ㄨㄛ)
    - derive/89/ㄨㄛ/
    - derive/89/ㄨㄤ/
    - derive/89/ㄏㄠ/
    - derive/89/ㄒㄧ/

    # 15 -> 的 (ㄉㄜ)
    - derive/15/ㄉㄜ/
    - derive/15/ㄉㄟ/
    - derive/15/ㄅㄨ/
    - derive/15/ㄚㄨ/

    # 單字符T9映射
    # 1: ㄅㄉㄚ
    - derive/1/ㄅ/
    - derive/1/ㄉ/
    - derive/1/ㄚ/

    # 2: ㄍㄐㄞㄧ
    - derive/2/ㄍ/
    - derive/2/ㄐ/
    - derive/2/ㄞ/
    - derive/2/ㄧ/

    # 3: ㄓㄗㄢㄦ
    - derive/3/ㄓ/
    - derive/3/ㄗ/
    - derive/3/ㄢ/
    - derive/3/ㄦ/

    # 4: ㄆㄊㄛ
    - derive/4/ㄆ/
    - derive/4/ㄊ/
    - derive/4/ㄛ/

    # 5: ㄎㄑㄟㄨ
    - derive/5/ㄎ/
    - derive/5/ㄑ/
    - derive/5/ㄟ/
    - derive/5/ㄨ/

    # 6: ㄔㄘㄣ
    - derive/6/ㄔ/
    - derive/6/ㄘ/
    - derive/6/ㄣ/

    # 7: ㄇㄋㄜㄝ
    - derive/7/ㄇ/
    - derive/7/ㄋ/
    - derive/7/ㄜ/
    - derive/7/ㄝ/

    # 8: ㄏㄒㄠㄩ
    - derive/8/ㄏ/
    - derive/8/ㄒ/
    - derive/8/ㄠ/
    - derive/8/ㄩ/

    # 9: ㄕㄙㄤㄥ
    - derive/9/ㄕ/
    - derive/9/ㄙ/
    - derive/9/ㄤ/
    - derive/9/ㄥ/

    # 0: ㄈㄌㄡㄖ
    - derive/0/ㄈ/
    - derive/0/ㄌ/
    - derive/0/ㄡ/
    - derive/0/ㄖ/

    # 組合規則處理
    # 確保注音符號組合符合發音規則
    - xform/^([ㄅ-ㄙ])([ㄧㄨㄩ]?)([ㄚ-ㄥ])([ˉˊˇˋ˙]?)$/$1$2$3$4/

translator:
  dictionary: bopomofo_t9
  spelling_hints: 8
  enable_completion: true
  sentence_over_completion: true
  strict_spelling: false

  # T9專用設定
  initial_quality: 1.2
  max_homophones: 7
  max_homographs: 1

  # 輸入顯示格式
  preedit_format:
    # 數字序列顯示提示
    - "xform/1/①ㄅㄉㄚ/"
    - "xform/2/②ㄍㄐㄞㄧ/"
    - "xform/3/③ㄓㄗㄢㄦ/"
    - "xform/4/④ㄆㄊㄛ/"
    - "xform/5/⑤ㄎㄑㄟㄨ/"
    - "xform/6/⑥ㄔㄘㄣ/"
    - "xform/7/⑦ㄇㄋㄜㄝ/"
    - "xform/8/⑧ㄏㄒㄠㄩ/"
    - "xform/9/⑨ㄕㄙㄤㄥ/"
    - "xform/0/⓪ㄈㄌㄡㄖ/"

  comment_format:
    - "xform/^([0-9]+)$/T9:$1/"
    - "xform/^([ㄅ-ㄩ]+)$/注音:$1/"

punctuator:
  import_preset: symbols

key_binder:
  import_preset: default
  bindings:
    - { when: has_menu, accept: minus, send: minus }
    - { when: has_menu, accept: equal, send: equal }

recognizer:
  import_preset: default