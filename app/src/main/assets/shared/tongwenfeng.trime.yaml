# Trime custom style settings
# encoding: utf-8

config_version: "3.0"
name: 標準          #方案名稱
author: 風花絮        #作者資訊

#鍵盤高度
height:
  1: &jpgd1 30 #表情鍵盤
  2: &jpgd2 24 #顏文字鍵盤1
  3: &jpgd3 24 #顏文字鍵盤2
  4: &jpgd4 56 #主鍵盤 - 增加高度以適應手錶
  5: &jpgd5 39.5 #符號鍵盤
  6: &hgap 2 #鍵盤橫縫大小 - 減少間距以增加按鍵面積
  7: &sgap 4 #鍵盤豎縫大小 - 減少間距以增加按鍵面積

#鍵盤高度
round_corner:
  1: &round1 12 #按鍵圓角半徑
  2: &round2 0 #候選窗口圓角
  3: &round3 12 #回車鍵圓角
  
#介面風格、功能開關
style:
  auto_caps: false #自動句首大寫:true|false|ascii
  candidate_font: han.ttf  #候選字體
  candidate_padding: 5  #候選項內邊距
  candidate_spacing: 0.5  #候選間距
  candidate_text_size: 18  #候選字號
  candidate_use_cursor: true #高亮候選項
  candidate_view_height: 28 #候選區高度
  comment_font: comment.ttf #編碼提示字體
  comment_height: 14 #編碼提示區高度
  comment_on_top: true #編碼提示在上方或右側
  comment_text_size: 12 #編碼提示字號
  hanb_font: hanb.ttf #擴充字體
  horizontal: true #水平模式
  horizontal_gap: *hgap #鍵水平間距
  layout:
    border: 0 #候選窗口邊框寬度
    max_width: 360 #最大寬度，超過則自動換行
    max_height: 300 #最大高度
    min_width: 0 #最小寬度
    min_height: 50 #最小高度
    margin_x: 0 #水平邊距 NOTE: margin_{x, y, bottom} 實際為 padding - 設為0實現滿版顯示
    margin_y: 0 #竖直邊距 - 設為0實現滿版顯示
    line_spacing: 0 #候選詞的行間距(px)
    line_spacing_multiplier: 1.2 #候選詞的行間距(倍數)
    spacing: 1 #螢幕上下邊緣或預編輯上下邊緣和懸浮窗之間的距離
    round_corner: *round2 #候選窗口圓角
    alpha: 0xff #透明度(0-255)
    background: 0xFFFFFFFF #顏色或者backgrounds目錄下的圖片文檔名
  key_font: symbol.ttf #鍵盤字體
  key_height: *jpgd4 #鍵高
  key_long_text_size: 16 #長標籤字號
  key_text_size: 28 #鍵字號 - 增加字體大小以適應手錶
  key_width: 10.0 #鍵寬，佔螢幕寬的百分比
  label_text_size: 22 #標籤字號
  label_font: label.ttf #編標籤字體
  latin_font: latin.ttf #西文本體
  keyboard_height: 300 #鎖定鍵盤高度，避免切換時鍵盤高度變化而造成閣爍 - 增加以適應大按鍵
  keyboard_height_land: 300 #鎖定橫屏下鍵盤高度，避免切換時鍵盤高度變化而造成閣爍 - 增加以適應大按鍵
  preview_font: latin.ttf #按鍵提示字體
  preview_height: 56 #按鍵提示高度
  preview_offset: -32 #按鍵提示縱向偏移
  preview_text_size: 40 #按鍵提示字號
  proximity_correction: true #按鍵纠錯
  reset_ascii_mode: false #顯示鍵盤時重置為中文狀態
  round_corner: *round1 #按鍵圓角半徑
  shadow_radius: 0.0 #按鍵陰影半徑
  speech_opencc_config: none #語音輸入簡繁轉換
  symbol_font: symbol.ttf #符號字體
  symbol_text_size: 10 #符號字號
  text_font: latin.ttf #編碼字體
  #text_height: 32 #編碼區高度
  text_size: 14 #編碼區字號
  vertical_correction: -5
  vertical_gap: *sgap #鍵盤行距
  enter_label_mode: 0  #是否使用App提供的ActionLabel內容作為Enter鍵的文本（由於多數App沒有適配ActionLable，實際影響不大）。0不使用，1只使用actionlabel，2優先使用，3當其他方式沒有獲得label時才讀取actionlabel
  enter_labels:  # 定義Enter鍵的文本
    go: 前往
    done: 完成
    next: 下個
    pre:  上個
    search: 搜索
    send: 發送
    default: Enter   # 定義預設Enter鍵的文本

# 最好保留一項，防止其他主題使用 __include 時無法加載
fallback_colors:
  candidate_text_color: text_color
# 以下值是程式內置的，你也可以在這裡自定義，這會覆蓋預設值
